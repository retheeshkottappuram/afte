[program:afte-trading-daemon]
process_name=%(program_name)s
command=/usr/bin/php /var/www/afte/artisan trade:daemon --mode=live --start
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/afte/storage/logs/trading_daemon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=30
killasgroup=true
stopasgroup=true
